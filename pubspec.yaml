name: signal_desk
description: Signal Desk multi-source shell with shared Cloudflare forced-IP edge.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  http: ^1.2.2
  html: ^0.15.6
  package_info_plus: ^8.3.0
  intl: ^0.20.2
  path: ^1.9.1
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/IWARA_API_INDEX.json
    - assets/cloudflare-ip-ranges.txt
